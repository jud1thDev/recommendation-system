services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  core-api:
    build:
      context: ./core-api
    environment:
      PORT: "8001"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      REDIS_URL: "redis://redis:6379/0"
      RECENT_EVENT_LIMIT: "30"
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8001/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rec-api:
    build:
      context: ./rec-api
    environment:
      PORT: "8000"
      CORE_API_URL: "http://core-api:8001"
      DATA_DIR: "/app/data"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_EVENTS_TOPIC: "rec-events"
      CANDIDATE_K: "${CANDIDATE_K:-36}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      core-api:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  event-worker:
    build:
      context: ./event-worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_EVENTS_TOPIC: "rec-events"
      REDIS_URL: "redis://redis:6379/0"
      MAX_EVENTS_PER_KEY: "200"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
